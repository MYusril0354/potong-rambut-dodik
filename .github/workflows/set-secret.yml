name: Set Admin Password

on:
  workflow_dispatch:
    inputs:
      admin_password:
        description: 'Password login admin yang baru'
        required: true
      admin_secret:
        description: 'ADMIN_SECRET (string acak 32+ karakter). Kosongkan bila tidak diubah.'
        required: false

jobs:
  set-secret:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Set ADMIN_PASSWORD
        run: printf '%s' "${{ github.event.inputs.admin_password }}" | npx wrangler secret put ADMIN_PASSWORD
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Set ADMIN_SECRET (opsional)
        if: github.event.inputs.admin_secret != ''
        run: printf '%s' "${{ github.event.inputs.admin_secret }}" | npx wrangler secret put ADMIN_SECRET
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}